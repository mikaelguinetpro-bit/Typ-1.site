<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120604">
  <title>Typ-1 — Le feu s'allume le 21 décembre</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/bientot.css">
  <script src="/bientot.js" defer></script>
</head>
<body>
  <video class="feu" src="/assets/typ1_feu_boucle.mp4" poster="/assets/typ1_poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
  <main class="voile" aria-labelledby="voile-titre">
    <img class="voile-logo" src="/assets/icone-192.png" alt="" width="132" height="132">
    <p class="voile-sur" data-t="kicker">Typ-1 · L'élément Feu</p>
    <h1 id="voile-titre" data-t="title">Le feu s'allume bientôt</h1>
    <p class="voile-date" data-t="date">Lundi 21 décembre à minuit, heure de Paris.</p>
    <div class="voile-decompte" role="timer" aria-live="off">
      <div><span id="d">00</span><small data-t="days">jours</small></div>
      <div><span id="h">00</span><small data-t="hours">heures</small></div>
      <div><span id="m">00</span><small data-t="minutes">minutes</small></div>
      <div><span id="s">00</span><small data-t="seconds">secondes</small></div>
    </div>
    <p class="voile-ligne" data-t="line">Le jour du solstice d'hiver, le feu s'allume pour le monde entier. À très vite, Créateur.</p>
  </main>
</body>
</html>
